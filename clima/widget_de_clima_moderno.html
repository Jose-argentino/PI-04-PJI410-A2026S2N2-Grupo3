<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Clima - Open-Meteo</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Dynamic Background Gradients */
    .bg-clear-day {
      background: linear-gradient(135deg, #38ef7d 0%, #11998e 50%, #0575E6 100%);
    }
    .bg-clear-night {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    }
    .bg-cloudy {
      background: linear-gradient(135deg, #636fa4 0%, #e8c3ad 100%);
    }
    .bg-rainy {
      background: linear-gradient(135deg, #3a7bd5 0%, #3a6073 100%);
    }
    .bg-stormy {
      background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
    }
    .bg-snowy {
      background: linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%);
    }

    /* Glassmorphism card styles */
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
    }

    /* Custom scrollbar for search results */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 8px;
    }

    /* Pulse Skeleton Loading Animation */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.1) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-clear-day flex items-center justify-center p-4 transition-all duration-700 ease-in-out text-white">

  <!-- Main Container -->
  <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
    
    <!-- Top Search & Geolocation Bar -->
    <div class="relative z-20 mb-6">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="cityInput"
            placeholder="Buscar cidade..."
            class="w-full glass-input rounded-2xl pl-10 pr-4 py-3 text-sm text-white placeholder-white/70 outline-none transition-all shadow-inner"
            autocomplete="off"
          />
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-white/70"></i>
        </div>
        <button 
          id="geoBtn"
          title="Usar minha localização"
          class="glass-input p-3 rounded-2xl hover:bg-white/30 transition-all duration-200 active:scale-95 flex items-center justify-center group"
        >
          <i data-lucide="crosshair" class="w-5 h-5 text-white group-hover:rotate-45 transition-transform duration-300"></i>
        </button>
      </div>

      <!-- Auto-complete Search Results Dropdown -->
      <div 
        id="searchResults" 
        class="hidden absolute left-0 right-0 top-14 bg-slate-900/80 backdrop-blur-xl border border-white/20 rounded-2xl shadow-xl overflow-hidden z-30 max-h-60 overflow-y-auto custom-scrollbar"
      >
        <!-- Dynamic search suggestions go here -->
      </div>
    </div>

    <!-- Loading State Skeleton -->
    <div id="loadingState" class="hidden space-y-6">
      <div class="space-y-2">
        <div class="h-6 w-3/4 skeleton rounded-lg"></div>
        <div class="h-4 w-1/2 skeleton rounded-lg"></div>
      </div>
      <div class="flex items-center justify-between my-6">
        <div class="h-16 w-24 skeleton rounded-xl"></div>
        <div class="h-16 w-16 skeleton rounded-full"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="h-16 skeleton rounded-xl"></div>
        <div class="h-16 skeleton rounded-xl"></div>
      </div>
      <div class="h-28 skeleton rounded-2xl mt-6"></div>
    </div>

    <!-- Error State Container -->
    <div id="errorState" class="hidden text-center py-8 space-y-3">
      <i data-lucide="alert-circle" class="w-12 h-12 text-red-300 mx-auto animate-bounce"></i>
      <p id="errorMessage" class="text-sm text-white/90 font-medium">Não foi possível carregar as informações do clima.</p>
      <button id="retryBtn" class="mt-2 text-xs bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl transition-all">Tentar novamente</button>
    </div>

    <!-- Weather Content -->
    <div id="weatherContent">
      <!-- Location and Date Header -->
      <div class="flex justify-between items-start">
        <div>
          <h1 id="cityName" class="text-2xl sm:text-3xl font-bold tracking-tight text-white drop-shadow-sm">--</h1>
          <p id="currentDate" class="text-xs sm:text-sm font-medium text-white/80 mt-1">--</p>
        </div>
      </div>

      <!-- Main Temperature & Icon -->
      <div class="flex items-center justify-between my-6 sm:my-8">
        <div>
          <div class="flex items-start">
            <span id="currentTemp" class="text-6xl sm:text-7xl font-bold tracking-tighter text-white drop-shadow-md">--</span>
            <span class="text-2xl sm:text-3xl font-medium text-white/80 mt-1">°C</span>
          </div>
          <p id="weatherDesc" class="text-base sm:text-lg font-medium text-white/90 capitalize mt-1">--</p>
        </div>
        <div id="weatherIconContainer" class="p-2">
          <i id="weatherIcon" data-lucide="cloud-sun" class="w-16 h-16 sm:w-20 sm:h-20 text-white drop-shadow-lg"></i>
        </div>
      </div>

      <!-- Weather Details Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="glass-card rounded-2xl p-3 sm:p-4 flex items-center space-x-3">
          <div class="p-2 rounded-xl bg-white/10 text-white">
            <i data-lucide="thermometer" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-[11px] font-medium text-white/70 uppercase tracking-wider">Sensação</p>
            <p id="feelsLike" class="text-sm sm:text-base font-semibold text-white">--°C</p>
          </div>
        </div>

        <div class="glass-card rounded-2xl p-3 sm:p-4 flex items-center space-x-3">
          <div class="p-2 rounded-xl bg-white/10 text-white">
            <i data-lucide="droplets" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-[11px] font-medium text-white/70 uppercase tracking-wider">Umidade</p>
            <p id="humidity" class="text-sm sm:text-base font-semibold text-white">--%</p>
          </div>
        </div>

        <div class="glass-card rounded-2xl p-3 sm:p-4 flex items-center space-x-3">
          <div class="p-2 rounded-xl bg-white/10 text-white">
            <i data-lucide="wind" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-[11px] font-medium text-white/70 uppercase tracking-wider">Vento</p>
            <p id="windSpeed" class="text-sm sm:text-base font-semibold text-white">-- km/h</p>
          </div>
        </div>

        <div class="glass-card rounded-2xl p-3 sm:p-4 flex items-center space-x-3">
          <div class="p-2 rounded-xl bg-white/10 text-white">
            <i data-lucide="gauge" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="text-[11px] font-medium text-white/70 uppercase tracking-wider">Pressão</p>
            <p id="pressure" class="text-sm sm:text-base font-semibold text-white">-- hPa</p>
          </div>
        </div>
      </div>

      <!-- 5-Day Forecast Section -->
      <div class="mt-6 pt-6 border-t border-white/15">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-white/80 mb-4 flex items-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Previsão para 5 dias
        </h3>
        <div id="forecastContainer" class="grid grid-cols-5 gap-2">
          <!-- Dynamic 5-day forecast cards -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // WMO Weather Interpretation Codes according to Open-Meteo standard
    const WMO_CODES = {
      0: { desc: 'Céu Limpo', icon: 'sun', bg: 'bg-clear-day', nightBg: 'bg-clear-night' },
      1: { desc: 'Predominantemente Limpo', icon: 'sun-medium', bg: 'bg-clear-day', nightBg: 'bg-clear-night' },
      2: { desc: 'Parcialmente Nublado', icon: 'cloud-sun', bg: 'bg-cloudy', nightBg: 'bg-clear-night' },
      3: { desc: 'Nublado', icon: 'cloud', bg: 'bg-cloudy', nightBg: 'bg-cloudy' },
      45: { desc: 'Névoa', icon: 'cloud-fog', bg: 'bg-cloudy', nightBg: 'bg-cloudy' },
      48: { desc: 'Geada Forte', icon: 'cloud-fog', bg: 'bg-cloudy', nightBg: 'bg-cloudy' },
      51: { desc: 'Garoa Leve', icon: 'cloud-drizzle', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      53: { desc: 'Garoa Moderada', icon: 'cloud-drizzle', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      55: { desc: 'Garoa Densa', icon: 'cloud-rain', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      61: { desc: 'Chuva Leve', icon: 'cloud-rain', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      63: { desc: 'Chuva Moderada', icon: 'cloud-rain', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      65: { desc: 'Chuva Forte', icon: 'cloud-heavy-rain', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      71: { desc: 'Neve Leve', icon: 'snowflake', bg: 'bg-snowy', nightBg: 'bg-snowy' },
      73: { desc: 'Neve Moderada', icon: 'snowflake', bg: 'bg-snowy', nightBg: 'bg-snowy' },
      75: { desc: 'Neve Forte', icon: 'snowflake', bg: 'bg-snowy', nightBg: 'bg-snowy' },
      80: { desc: 'Pancadas de Chuva', icon: 'cloud-rain-wind', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      81: { desc: 'Chuva Intensa', icon: 'cloud-rain-wind', bg: 'bg-rainy', nightBg: 'bg-rainy' },
      82: { desc: 'Tempestade de Chuva', icon: 'cloud-lightning', bg: 'bg-stormy', nightBg: 'bg-stormy' },
      95: { desc: 'Tempestade', icon: 'cloud-lightning', bg: 'bg-stormy', nightBg: 'bg-stormy' },
      96: { desc: 'Tempestade com Granizo', icon: 'cloud-hail', bg: 'bg-stormy', nightBg: 'bg-stormy' },
      99: { desc: 'Tempestade Forte com Granizo', icon: 'cloud-hail', bg: 'bg-stormy', nightBg: 'bg-stormy' }
    };

    // DOM Element References
    const cityInput = document.getElementById('cityInput');
    const searchResults = document.getElementById('searchResults');
    const geoBtn = document.getElementById('geoBtn');
    const weatherContent = document.getElementById('weatherContent');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const retryBtn = document.getElementById('retryBtn');

    let debounceTimer;
    let currentGeoLocation = null;

    window.addEventListener('DOMContentLoaded', () => {
      // Initialize icons
      lucide.createIcons();
      // Default initial location: São Paulo, Brazil
      fetchWeatherByCoordinates(-23.5505, -46.6333, 'São Paulo', 'Brasil');
    });

    // Auto-search debounce logic
    cityInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();
      if (query.length < 2) {
        searchResults.classList.add('hidden');
        return;
      }
      debounceTimer = setTimeout(() => searchCities(query), 350);
    });

    // Close search dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!cityInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

    // Handle Browser Geolocation
    geoBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showError('Geolocalização não é suportada pelo seu navegador.');
        return;
      }

      showLoading();
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          
          // Reverse geocoding using Open-Meteo or fallback
          try {
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${lat.toFixed(2)},${lon.toFixed(2)}&count=1&language=pt`;
            // Reverse geocode fallback query using Open-Meteo Geocoding
            await fetchWeatherByCoordinates(lat, lon, 'Sua Localização', '');
          } catch {
            await fetchWeatherByCoordinates(lat, lon, 'Sua Localização', '');
          }
        },
        (error) => {
          let msg = 'Erro ao obter localização.';
          if (error.code === 1) msg = 'Permissão de localização negada.';
          showError(msg);
        },
        { timeout: 10000 }
      );
    });

    retryBtn.addEventListener('click', () => {
      if (currentGeoLocation) {
        fetchWeatherByCoordinates(currentGeoLocation.lat, currentGeoLocation.lon, currentGeoLocation.name, currentGeoLocation.country);
      } else {
        fetchWeatherByCoordinates(-23.5505, -46.6333, 'São Paulo', 'Brasil');
      }
    });

    // Search cities via Open-Meteo Geocoding API
    async function searchCities(query) {
      try {
        const response = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=pt&format=json`
        );
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          searchResults.innerHTML = `<div class="p-3 text-xs text-white/70 text-center">Nenhuma cidade encontrada</div>`;
          searchResults.classList.remove('hidden');
          return;
        }

        searchResults.innerHTML = '';
        data.results.forEach(city => {
          const item = document.createElement('div');
          item.className = 'px-4 py-3 hover:bg-white/10 cursor-pointer text-sm border-b border-white/5 last:border-0 flex items-center justify-between transition-colors';
          const countryStr = city.country ? `, ${city.country}` : '';
          const adminStr = city.admin1 ? ` (${city.admin1})` : '';
          
          item.innerHTML = `
            <div>
              <span class="font-medium text-white">${city.name}</span>
              <span class="text-xs text-white/60 block">${adminStr}${countryStr}</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-white/40"></i>
          `;

          item.addEventListener('click', () => {
            cityInput.value = '';
            searchResults.classList.add('hidden');
            fetchWeatherByCoordinates(city.latitude, city.longitude, city.name, city.country || '');
          });

          searchResults.appendChild(item);
        });

        lucide.createIcons();
        searchResults.classList.remove('hidden');
      } catch (err) {
        console.error('Erro na API de busca de cidades:', err);
      }
    }

    // Fetch Weather Data by Coordinates
    async function fetchWeatherByCoordinates(lat, lon, cityName, country = '') {
      currentGeoLocation = { lat, lon, name: cityName, country };
      showLoading();

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,surface_pressure,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error('Não foi possível se conectar com o serviço de clima.');
        
        const data = await response.json();
        updateUI(data, cityName, country);
      } catch (err) {
        console.error('Erro ao buscar dados meteorológicos:', err);
        showError('Erro ao carregar dados do tempo. Verifique sua conexão.');
      }
    }

    // Render and Update UI
    function updateUI(data, cityName, country) {
      const current = data.current;
      const daily = data.daily;

      // Location & Date
      document.getElementById('cityName').textContent = country ? `${cityName}, ${country}` : cityName;
      
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'short' };
      const formattedDate = now.toLocaleDateString('pt-BR', options);
      document.getElementById('currentDate').textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);

      // Temperatures & Metrics
      document.getElementById('currentTemp').textContent = Math.round(current.temperature_2m);
      document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;
      document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
      document.getElementById('windSpeed').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      document.getElementById('pressure').textContent = `${Math.round(current.surface_pressure)} hPa`;

      // Weather condition lookup
      const weatherCode = current.weather_code;
      const condition = WMO_CODES[weatherCode] || { desc: 'Desconhecido', icon: 'cloud', bg: 'bg-clear-day', nightBg: 'bg-clear-night' };

      document.getElementById('weatherDesc').textContent = condition.desc;

      // Dynamic theme background application
      const isDay = current.is_day === 1;
      const dynamicBg = isDay ? condition.bg : condition.nightBg;
      
      // Update body background class
      document.body.className = `min-h-screen ${dynamicBg} flex items-center justify-center p-4 transition-all duration-700 ease-in-out text-white`;

      // Update Icon
      const iconContainer = document.getElementById('weatherIconContainer');
      const iconName = (!isDay && condition.icon === 'sun') ? 'moon' : condition.icon;
      iconContainer.innerHTML = `<i data-lucide="${iconName}" class="w-16 h-16 sm:w-20 sm:h-20 text-white drop-shadow-lg animate-pulse"></i>`;

      // Render 5-Day Forecast
      const forecastContainer = document.getElementById('forecastContainer');
      forecastContainer.innerHTML = '';

      // Loop through next 5 days
      for (let i = 0; i < 5; i++) {
        const dateStr = daily.time[i];
        const dateObj = new Date(dateStr + 'T00:00:00');
        
        let dayName = dateObj.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
        dayName = dayName.charAt(0).toUpperCase() + dayName.slice(1);

        if (i === 0) dayName = 'Hoje';

        const maxTemp = Math.round(daily.temperature_2m_max[i]);
        const minTemp = Math.round(daily.temperature_2m_min[i]);
        const dayCode = daily.weather_code[i];
        const dayCondition = WMO_CODES[dayCode] || { icon: 'cloud' };

        const forecastCard = document.createElement('div');
        forecastCard.className = 'glass-card rounded-2xl p-2.5 text-center flex flex-col items-center justify-between hover:bg-white/20 transition-all';
        forecastCard.innerHTML = `
          <p class="text-[11px] font-medium text-white/80">${dayName}</p>
          <div class="my-2">
            <i data-lucide="${dayCondition.icon}" class="w-6 h-6 text-white mx-auto"></i>
          </div>
          <div class="text-[11px] font-semibold">
            <span class="text-white">${maxTemp}°</span>
            <span class="text-white/60 ml-0.5">${minTemp}°</span>
          </div>
        `;

        forecastContainer.appendChild(forecastCard);
      }

      // Re-initialize Lucide Icons
      lucide.createIcons();
      showContent();
    }

    function showLoading() {
      weatherContent.classList.add('hidden');
      errorState.classList.add('hidden');
      loadingState.classList.remove('hidden');
    }

    function showContent() {
      loadingState.classList.add('hidden');
      errorState.classList.add('hidden');
      weatherContent.classList.remove('hidden');
    }

    function showError(msg) {
      loadingState.classList.add('hidden');
      weatherContent.classList.add('hidden');
      errorMessage.textContent = msg;
      errorState.classList.remove('hidden');
    }
  </script>
</body>
</html>
