        <div id="status-message" class="status-message hidden"></div>

        <div style="margin-top: 20px;">
          <h3 style="color: #38bdf8; font-size: 0.9rem; margin-bottom: 6px; text-transform: uppercase;">
            <i class="ph ph-chart-line-up"></i> Média dos 2 Sensores (15cm e 30cm)
          </h3>
          <div style="position: relative; height:240px; width:100%;">
            <canvas id="soilMediaChart"></canvas>
          </div>
        </div>
